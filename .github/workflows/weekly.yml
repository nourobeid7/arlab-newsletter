name: Weekly newsletter

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      skip_generate:
        description: "Skip generation, send existing history payload for today"
        required: false
        default: "false"
      recipients:
        description: "Comma-separated recipient list (override default wissam@thearlab.com)"
        required: false
        default: ""
      preamble_html:
        description: "One-off HTML preamble injected at top of email body"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate and send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipients != '' && github.event.inputs.recipients || 'wissam@thearlab.com' }}
          SENDER_EMAIL: nour@thearlab.com
          SKIP_GENERATE: ${{ github.event.inputs.skip_generate == 'true' && '1' || '' }}
          PREAMBLE_HTML: ${{ github.event.inputs.preamble_html }}
        run: python generate.py

      - name: Commit history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          if ! git diff --staged --quiet; then
            git commit -m "Newsletter $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
